<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050917" />
    <title>雷霆突击</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="雷霆突击游戏画面"></canvas>

      <section class="hud" aria-live="polite">
        <div class="hud-block">
          <span class="hud-label">得分</span>
          <strong id="score">000000</strong>
        </div>
        <div class="hud-center">
          <span id="stage">第 1 波</span>
          <div class="boss-bar" id="bossBar" hidden>
            <span id="bossHealth"></span>
          </div>
        </div>
        <div class="hud-block hud-right">
          <span class="hud-label">最高</span>
          <strong id="highScore">000000</strong>
        </div>
      </section>

      <div class="status-row">
        <div class="lives" id="lives"></div>
        <div class="power">火力 <span id="powerPips"></span></div>
      </div>

      <section class="overlay active" id="startScreen">
        <div class="eyebrow">NEON STRIKE FORCE</div>
        <div class="hero-plane" aria-hidden="true">
          <i class="hero-plane-glow"></i>
          <i class="hero-plane-wing hero-plane-wing-left"></i>
          <i class="hero-plane-wing hero-plane-wing-right"></i>
          <i class="hero-plane-body"></i>
          <i class="hero-plane-cockpit"></i>
          <i class="hero-plane-flame"></i>
        </div>
        <h1>雷霆<span>突击</span></h1>
        <p>穿越弹幕，击溃敌军核心。</p>
        <button id="startButton">开始作战</button>
        <div class="controls">
          <span><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动</span>
          <span><kbd>空格</kbd> 射击 · <kbd>P</kbd> 暂停</span>
          <span class="touch-hint">触屏拖动战机，自动射击</span>
        </div>
      </section>

      <section class="overlay" id="gameOverScreen">
        <div class="eyebrow">MISSION REPORT</div>
        <h2>任务结束</h2>
        <p>最终得分</p>
        <strong class="final-score" id="finalScore">0</strong>
        <p class="new-record" id="newRecord" hidden>新纪录！</p>
        <button id="restartButton">再次出击</button>
      </section>

      <div class="pause-label" id="pauseLabel" hidden>已暂停</div>
      <div class="scanlines"></div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
